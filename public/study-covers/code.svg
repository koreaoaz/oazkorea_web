<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071322"/><stop offset="1" stop-color="#183747"/></linearGradient><radialGradient id="glow"><stop stop-color="#5eead4" stop-opacity=".25"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient></defs><rect width="1000" height="1000" fill="url(#bg)"/><circle cx="680" cy="380" r="480" fill="url(#glow)"/><text x="75" y="135" font-family="sans-serif" font-size="26" letter-spacing="6" fill="#67e8f9">FROM LOGIC TO SYSTEMS</text><text x="75" y="230" font-family="sans-serif" font-weight="bold" font-size="80" fill="white">C PROGRAMMING</text><rect x="75" y="305" width="850" height="390" rx="24" fill="#0b1525" stroke="#41586f" stroke-width="2"/><circle cx="110" cy="340" r="8" fill="#fda4af"/><circle cx="140" cy="340" r="8" fill="#fde68a"/><circle cx="170" cy="340" r="8" fill="#6ee7b7"/><g font-family="monospace" font-size="33"><text x="120" y="415" fill="#93c5fd">int sum(const int *values, int n) {</text><text x="155" y="475" fill="#e2e8f0">int total = 0;</text><text x="155" y="535" fill="#c4b5fd">for (int i = 0; i &lt; n; i++)</text><text x="190" y="595" fill="#fcd34d">total += values[i];</text><text x="155" y="650" fill="#6ee7b7">return total; }</text></g><rect x="80" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="100" y="800" fill="#bae6fd" font-family="monospace" font-size="25">00</text><rect x="185" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="205" y="800" fill="#bae6fd" font-family="monospace" font-size="25">01</text><rect x="290" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="310" y="800" fill="#bae6fd" font-family="monospace" font-size="25">02</text><rect x="395" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="415" y="800" fill="#bae6fd" font-family="monospace" font-size="25">03</text><rect x="500" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="520" y="800" fill="#bae6fd" font-family="monospace" font-size="25">04</text><rect x="605" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="625" y="800" fill="#bae6fd" font-family="monospace" font-size="25">05</text><rect x="710" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="730" y="800" fill="#bae6fd" font-family="monospace" font-size="25">06</text><rect x="815" y="755" width="90" height="70" rx="8" fill="#214358" stroke="#67e8f9" stroke-opacity=".5"/><text x="835" y="800" fill="#bae6fd" font-family="monospace" font-size="25">07</text><text x="80" y="875" fill="#bed6df" font-family="monospace" font-size="21">POINTERS · MEMORY · CONTROL FLOW</text><text x="75" y="935" fill="#9bbac7" font-family="sans-serif" font-size="20" letter-spacing="5">OAZ • TOPIC ILLUSTRATION</text></svg>