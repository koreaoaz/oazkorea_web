name: Privacy hotfix
on:
  push:
    branches: [hotfix/privacy-p0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: privacy-hotfix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://offline.invalid
      NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_offline_fixture
      NEXT_PUBLIC_OAZ_PRIVACY_V2: 'false'
      NEXT_PUBLIC_OAZ_OAUTH_TEST_ORIGIN: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:security
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:preview
      - run: npm test
      - run: npm run build:offline
      - run: npm run test:runtime
      - run: npm run build:offline -- --privacy-v3
      - run: npm run typecheck
      - run: git diff --check
  isolated-postgres:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare hash-pinned official portable PostgreSQL
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-17.6.zip'
          Invoke-WebRequest -Uri 'https://get.enterprisedb.com/postgresql/postgresql-17.6-1-windows-x64-binaries.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd378882abd001a186735acd6f6ba716bca6ccd192e800412d4fd15ed25376b3e') { throw 'Official archive integrity mismatch' }
      - name: Synthetic PostgreSQL RLS and GRANT regression, automatic grants ON and OFF
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'postgresql-17.6.zip'
          $lab = Join-Path $env:RUNNER_TEMP 'oaz-privacy-lab'
          python -B scripts/test-isolated-db.py --archive $archive --work $lab --privacy-v3 --auto-grants on
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/test-isolated-db.py --archive $archive --work $lab --privacy-v3 --auto-grants off
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The native pg_graphql/PostgREST suite is also run locally.
      # This job is SQL-only and does not claim to run real Auth or HTTP/GraphQL.
  local-supabase:
    if: github.ref == 'refs/heads/hotfix/privacy-p0' || github.head_ref == 'hotfix/privacy-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Name the exact checked-out commit in this disposable runner
        run: git switch -c hotfix/privacy-p0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: supabase/setup-cli@v1
        with:
          version: 2.54.11
      - name: Start verified loopback-only fake stack
        run: npm run local:start
      - name: Actual SDK Auth, signup, RLS, REST, GraphQL and private Storage
        run: npm run test:local-supabase
      - name: Mark only the successfully tested disposable fixture
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync('build/oauth', { recursive: true });
          writeFileSync('build/oauth/fixture-provenance.json', JSON.stringify({
            version: 1, project: 'oaz-privacy-local', syntheticAppFixture: true,
            sqlSha256: 'bea86d888eea295c5ef092b2fa0f39955d494cf4b81a304615cf3079be57ed98'
          }), { flag: 'wx' });
          NODE
      - name: Content RLS with actual ordinary JWTs, REST, GraphQL and same-token revocation
        run: |
          node scripts/local-content-guard.mjs apply
          node scripts/test-local-content-security.mjs verify
      - name: Stop only the local test project
        if: always()
        run: npm run local:stop
